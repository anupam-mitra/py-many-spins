[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-many-spins"
version = "0.1.0"
description = "Simulation workflows for many-body quantum dynamics using TenPy, Quimb, and QuTiP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
  "quantum dynamics",
  "many-body physics",
  "tensor networks",
  "tenpy",
  "quimb",
  "qutip",
]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy",
  "pandas",
]

[project.optional-dependencies]
tenpy = [
  "physics-tenpy",
  "h5py",
]
qutip = [
  "qutip",
]
quimb = [
  "quimb",
]
dev = [
  "pytest>=8",
]
all = [
  "physics-tenpy",
  "h5py",
  "qutip",
  "quimb",
  "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "conversions*",
  "indexing*",
  "manybody_util*",
  "time_evolution*",
  "wrap_qutip*",
  "wrap_quimb*",
  "wrap_tenpy*",
]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-q"
